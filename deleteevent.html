<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Event | EventHub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body data-access="admin">

<header class="navbar" id="site-navbar"></header>

<main class="container">

  <div class="form-card">
    <h1>Delete event</h1>
    <div class="alert alert-danger">
      <strong>Warning:</strong> Are you sure you want to delete this event? This action cannot be undone and will cancel all registered users.
    </div>

    <table class="details-table">
      <tr><th>ID</th><td>101</td></tr>
      <tr><th>Title</th><td>Web Development Conference</td></tr>
      <tr><th>Date</th><td>2026-11-15</td></tr>
      <tr><th>Location</th><td>Cairo University</td></tr>
    </table>

    <form action="adminevents.html" method="post">
      <div class="form-actions">
        <button type="submit" class="btn btn-danger">Yes, delete event</button>
        <a class="btn btn-outline" href="adminevents.html">Cancel</a>
      </div>
    </form>
  </div>

</main>

<footer class="footer" id="site-footer"></footer>
<script src="js/storage.js"></script>
<script src="js/session.js"></script>
<script src="js/guard.js"></script>
<script src="js/navbar.js"></script>
</body>
</html>

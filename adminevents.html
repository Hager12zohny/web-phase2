<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Events | EventHub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body data-access="admin">

<header class="navbar" id="site-navbar"></header>

<main class="container">

  <div class="page-header with-action">
    <div>
      <h1>Manage events</h1>
      <p>View, edit or delete the events you have created.</p>
    </div>
    <a class="btn" href="addevent.html">Add new event</a>
  </div>

  <div class="table-wrap">
    <table>
      <caption>All Created Events</caption>
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Title</th>
          <th scope="col">Date</th>
          <th scope="col">Location</th>
          <th scope="col">Category</th>
          <th scope="col">Seats</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
<tbody id="events-table-body"></tbody>
    </table>
  </div>

</main>

<footer class="footer" id="site-footer"></footer>
<script src="js/storage.js"></script>
<script src="js/session.js"></script>
<script src="js/guard.js"></script>
<script src="js/navbar.js"></script>
<script src="js/admin-events.js"></script> <!-- JavaScript will display all events here -->
</body>
</html>

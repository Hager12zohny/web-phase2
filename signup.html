<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | EventHub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body data-access="guest-only">

<header class="navbar" id="site-navbar"></header>

<main class="container">
  <div class="auth-wrap">
    <div class="auth-img" role="img" aria-label="Two people shaking hands"></div>
    <div class="form-card">
      <h1>Create your account</h1>
      <p class="subtitle">Fields marked with * are required.</p>

      <div id="form-msg" class="form-msg" role="alert"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="username" class="required">Username</label>
          <input type="text" id="username" name="username" required minlength="3" maxlength="20"
                 pattern="[A-Za-z0-9_]{3,20}" title="Use 3 to 20 letters, numbers or underscores"
                 autocomplete="username" placeholder="Choose a username">
          <small>3 to 20 characters: letters, numbers and underscores.</small>
        </div>

        <div class="form-group">
          <label for="email" class="required">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="password" class="required">Password</label>
          <input type="password" id="password" name="password" required minlength="8"
                 pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                 title="Use at least 8 characters with an uppercase letter, a lowercase letter and a digit"
                 autocomplete="new-password" placeholder="At least 8 characters">
          <small>At least 8 characters with an uppercase letter, a lowercase letter and a digit.</small>
        </div>

        <div class="form-group">
          <label for="confirm_password" class="required">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" required
                 autocomplete="new-password" placeholder="Re-type your password">
        </div>

        <div class="form-group">
          <label for="role" class="required">Account type</label>
          <select id="role" name="role" required>
            <option value="">Choose an account type</option>
            <option value="user">User (register for events)</option>
            <option value="admin">Administrator (organize events)</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn">Create account</button>
          <button type="reset" class="btn btn-outline">Clear form</button>
        </div>
      </form>

      <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</main>

<footer class="footer" id="site-footer"></footer>

<script src="js/storage.js"></script>
<script src="js/session.js"></script>
<script src="js/guard.js"></script>
<script src="js/navbar.js"></script>
<script src="js/form-ui.js"></script>
<script src="js/signup.js"></script>
</body>
</html>

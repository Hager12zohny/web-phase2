
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details | EventHub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
</head>

<body data-access="admin">

<header class="navbar" id="site-navbar"></header>

<main class="container">

  <div class="details-box">

    <div class="details-img img-conference" role="img"
         aria-label="Event Image"></div>

    <h1 id="details-title"></h1>

    <p>
      <span class="badge" id="details-category"></span>
    </p>

    <table class="details-table">

      <tr>
        <th>Event ID</th>
        <td id="details-id"></td>
      </tr>

      <tr>
        <th>Date</th>
        <td id="details-date"></td>
      </tr>

      <tr>
        <th>Location</th>
        <td id="details-location"></td>
      </tr>

      <tr>
        <th>Category</th>
        <td id="details-category-text"></td>
      </tr>

      <tr>
        <th>Number of Seats</th>
        <td id="details-seats"></td>
      </tr>

    </table>

    <h2>About this event</h2>

    <p id="details-description"></p>

    <div class="form-actions">

      <a class="btn" id="details-edit" href="#">Edit event</a>

      <a class="btn btn-danger" id="details-delete" href="#">Delete event</a>

      <a class="btn btn-outline" href="adminevents.html">Back to events</a>

    </div>

  </div>

</main>

<footer class="footer" id="site-footer"></footer>

<script src="js/storage.js"></script>
<script src="js/session.js"></script>
<script src="js/guard.js"></script>
<script src="js/navbar.js"></script>
<script src="js/admin-details.js"></script>

</body>
</html>
